plugins {
    id "com.android.application"
    id "kotlin-android"
    // Flutter Gradle Plugin must be applied after Android and Kotlin
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.example.passport_photos"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        // Java 17 is now standard for Gradle 8.13+
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.example.passport_photos"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            // Enable code shrinking and obfuscation for release
            minifyEnabled true
            shrinkResources false

            // Use the default and custom ProGuard rule files
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'

            // Use debug key for now (you can replace this with a release signing config later)
            signingConfig = signingConfigs.debug
        }

        debug {
            minifyEnabled false
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    // Include OkHttp and Okio to fix uCrop missing classes
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okio:okio:3.4.0'
}
